<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>余烬</title>
  <link rel="icon" href="assets/brand.svg" type="image/svg+xml">
  <link rel="stylesheet" href="ember_ui/workbench.css">
  <link rel="stylesheet" href="ember_ui/task-detail.css" data-page-style="task" disabled>
  <link rel="stylesheet" href="ember_ui/project.css" data-page-style="project" disabled>
  <link rel="stylesheet" href="ember_ui/system.css" data-page-style="system" disabled>
  <link rel="stylesheet" href="assets/workbench-pages.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside id="sidebar" class="app-sidebar" aria-label="工作台导航" data-mobile-sidebar>
      <header class="sidebar-identity">
        <a class="brand" href="#home" aria-label="余烬首页"><svg class="brand-mark" viewBox="0 0 256 256" fill="none" aria-hidden="true" focusable="false"><path d="M68 146H194C197 106 186 68 162 36C154 58 128 68 100 86C76 102 62 124 62 150C62 194 94 222 134 222C160 222 180 212 194 196" stroke="currentColor" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-copy">余烬 <span class="brand-subtitle">本地工作台</span></span></a>
        <button id="menu-toggle" class="sidebar-mobile-toggle" type="button" aria-expanded="false" aria-controls="sidebar-nav">菜单</button>
      </header>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="页面与工作区">
        <div class="sidebar-nav-main">
          <a class="sidebar-primary" href="#home" data-nav="home"><span class="sidebar-primary-marker" aria-hidden="true">·</span>任务台</a>
          <a class="sidebar-primary" href="#projects" data-nav="projects"><span class="sidebar-primary-marker" aria-hidden="true">·</span>项目视图</a>
          <a class="sidebar-primary" href="#review" data-nav="review"><span class="sidebar-primary-marker" aria-hidden="true">·</span>任务检视</a>
          <a class="sidebar-primary" href="#library" data-nav="library"><span class="sidebar-primary-marker" aria-hidden="true">·</span>资料浏览</a>
          <a class="sidebar-primary" href="#settings" data-nav="settings"><span class="sidebar-primary-marker" aria-hidden="true">·</span>设置</a>
          <div class="sidebar-group">工作区</div>
          <div id="workspace-nav"></div>
        </div>
        <div class="sidebar-bottom"><button id="update-button" class="sidebar-update-button" type="button" data-action="check-update"><span aria-hidden="true">↻</span>检查更新</button><div class="sidebar-runtime-status" aria-label="工作区状态"><span id="workspace-state" class="machine">正在读取工作区…</span><span id="workspace-version" class="sync-state"></span></div></div>
      </nav>
      <script src="ember_ui/sidebar-state.js"></script>
    </aside>
    <main id="main-content" class="shell app-main" tabindex="-1"><div class="loading-state" role="status">正在读取工作区…</div></main>
  </div>
  <dialog id="workbench-dialog" class="paper-dialog workbench-dialog" aria-labelledby="dialog-title">
    <header class="paper-dialog-head"><div><h2 id="dialog-title"></h2></div><button id="dialog-close" class="home-dialog-close" type="button" aria-label="关闭弹窗">×</button></header>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>
  <!-- Execution confirmation, same markup as the full workbench; driven by ember_ui/execution-confirm.js. -->
  <dialog class="execution-confirm-dialog" id="executionConfirmDialog" aria-labelledby="executionConfirmTitle"><div class="execution-confirm-shell"><header class="execution-confirm-head"><div><h2 id="executionConfirmTitle">确认执行</h2><p id="executionConfirmAction">—</p></div><button class="execution-confirm-close" id="executionConfirmClose" type="button" aria-label="关闭">×</button></header><div class="execution-confirm-body"><section class="execution-prompt-pane"><div class="execution-confirm-label"><span>固定提示词</span><small id="executionPromptMeta">五段 · 只读</small></div><div class="execution-confirm-prompt markdown-body" id="executionConfirmFixed">正在生成…</div></section><aside class="execution-confirm-context"><section class="execution-task-editor"><div class="execution-confirm-label"><label for="executionTaskInput">任务</label><small id="executionTaskMeta">0 / 4000</small></div><textarea id="executionTaskInput" maxlength="4000" rows="8" placeholder="输入本轮任务提示词"></textarea><button class="link-button" id="executionTaskReset" type="button">恢复默认任务</button></section><div class="execution-confirm-facts"><div class="execution-confirm-fact"><small>选择范围</small><span id="executionConfirmScope">—</span></div></div></aside></div><footer class="execution-confirm-foot"><button class="button ghost" id="executionConfirmCopy" type="button" disabled>复制提示词</button><button class="button ghost" id="executionConfirmBack" type="button">返回修改</button><div class="execution-confirm-runner"><span class="execution-confirm-runner-name" id="executionConfirmExecutor" role="status">正在读取设置…</span><a class="button ghost execution-confirm-configure" id="executionConfirmConfigure" href="#settings" hidden>去配置</a><button class="button primary gstudio-execute-key" id="executionConfirmDispatch" type="button" aria-label="确认执行" title="确认执行" disabled><svg class="gstudio-mark" viewBox="0 0 256 256" fill="none" aria-hidden="true" focusable="false"><path d="M68 146H194C197 106 186 68 162 36C154 58 128 68 100 86C76 102 62 124 62 150C62 194 94 222 134 222C160 222 180 212 194 196" stroke="currentColor" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></footer></div></dialog>
  <script src="ember_ui/ember-ui.js"></script>
  <script src="ember_ui/sidebar.js"></script>
  <script src="ember_ui/execution-confirm.js"></script>
  <script src="ember_ui/task-detail.js"></script>
  <script src="ember_ui/home.js"></script>
  <script src="ember_ui/task-overview.js"></script>
  <script src="ember_ui/project.js"></script>
  <script src="ember_ui/system.js"></script>
  <script src="ember_ui/review.js"></script>
  <script src="ember_ui/library.js"></script>
  <script src="app.js"></script>
</body>
</html>
