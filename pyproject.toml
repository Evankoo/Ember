[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gstudio-core"
version = "0.8.2"
description = "Continue every AI collaboration: local Markdown task cards that any AI tool can pick up again."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]
authors = [{name = "Evankoo"}]
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
gstudio = "gstudio_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
gstudio_core = ["web/**/*", "web/*", "examples/**/*", "examples/workspace/.gstudio/*.json", "templates/**/*", "templates/*", "skills/**/*"]

[tool.setuptools.exclude-package-data]
gstudio_core = ["**/__pycache__/*", "**/*.pyc"]
