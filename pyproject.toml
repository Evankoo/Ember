[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ember"
version = "0.10.1"
description = "Every conversation rekindles from the last one's embers: local Markdown task cards that people and AI work from together."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]
authors = [{name = "Evankoo"}]
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
ember = "ember.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ember = ["web/**/*", "web/*", "examples/**/*", "examples/workspace/.ember/*.json", "templates/**/*", "templates/*", "skills/**/*"]

[tool.setuptools.exclude-package-data]
ember = ["**/__pycache__/*", "**/*.pyc"]
