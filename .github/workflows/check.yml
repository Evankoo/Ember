name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: gstudio init /tmp/gstudio-example --example
      - run: gstudio check --workspace /tmp/gstudio-example
      - run: python -m pip wheel . --no-deps -w dist
      - name: Verify wheel resources and exclude bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('gstudio_core-*.whl'))) as wheel:
              names = set(wheel.namelist())
              assert not any('__pycache__' in name or name.endswith(('.pyc', '.pyo')) for name in names)
              assert {'gstudio_core/web/index.html', 'gstudio_core/web/app.js', 'gstudio_core/web/fonts/OFL.txt', 'gstudio_core/skills/gstudio-init/scripts/bootstrap.py', 'gstudio_core/executors.py'} <= names
              assert any(name.startswith('gstudio_core/examples/workspace/tasks/') for name in names)
          PY
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_browser.py -v
