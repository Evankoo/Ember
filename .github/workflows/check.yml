name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: ember init /tmp/ember-example --example
      - run: ember check --workspace /tmp/ember-example
      - run: python -m pip wheel . --no-deps -w dist
      - name: Verify wheel resources and exclude bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('ember-*.whl'))) as wheel:
              names = set(wheel.namelist())
              assert not any('__pycache__' in name or name.endswith(('.pyc', '.pyo')) for name in names)
              assert {'ember/ember_ui/pages/shell.py', 'ember/pages.py', 'ember/web/app.js', 'ember/web/fonts/OFL.txt', 'ember/skills/ember-init/scripts/bootstrap.py', 'ember/executors.py'} <= names
              assert {'ember/onboarding.py', 'ember/onboarding_completion.py', 'ember/project_registration.py', 'ember/skills/ember-project/SKILL.md', 'ember/skills/ember-project/scripts/project.py'} <= names
              assert any(name.startswith('ember/examples/workspace/tasks/') for name in names)
              assert not any(name.startswith('ember/examples/workspace/archive/') or name.endswith('/archive-records.json') for name in names)
              assert b'def archive_item(' not in wheel.read('ember/store.py')
              assert b'"/api/archive"' not in wheel.read('ember/server.py')
              assert b'renderArchive' not in wheel.read('ember/web/app.js')
          PY
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: ember init "$env:RUNNER_TEMP\余烬测试" --example
      - run: ember check --workspace "$env:RUNNER_TEMP\余烬测试"
  browser:
    # Playwright 1.60.0 has no Chromium build for the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . playwright==1.60.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_browser.py -v
